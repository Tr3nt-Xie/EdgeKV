syntax = "proto3";

package edgekv.v1;

option go_package = "github.com/Tr3nt-Xie/EdgeKV/internal/pb;pb";

// ---------------------------------------------------------------------------
// Raft log and persistent state
// ---------------------------------------------------------------------------

enum EntryType {
  // A client command for the state machine.
  ENTRY_NORMAL = 0;
  // Appended by a new leader so that it can commit an entry from its own term
  // (Raft §5.4.2 / §8). Never reaches the state machine.
  ENTRY_NOOP = 1;
}

message Entry {
  uint64 index = 1;
  uint64 term = 2;
  EntryType type = 3;
  bytes data = 4;
}

// HardState is what Raft must make durable before answering any RPC.
message HardState {
  uint64 term = 1;
  string voted_for = 2;
}

message SnapshotMeta {
  uint64 last_included_index = 1;
  uint64 last_included_term = 2;
  // WAL segments with a sequence number below this must be ignored on
  // recovery. Set when a follower installs a snapshot that does not match its
  // log and therefore discards the whole log: writing it inside the snapshot
  // file makes "new snapshot + log reset" a single atomic rename.
  uint64 min_wal_segment = 3;
}

// ---------------------------------------------------------------------------
// Raft RPCs. Every message carries the Raft group (shard) it belongs to,
// because one node hosts a replica of several groups (Multi-Raft).
// ---------------------------------------------------------------------------

message RequestVoteRequest {
  uint32 group = 1;
  uint64 term = 2;
  string candidate_id = 3;
  uint64 last_log_index = 4;
  uint64 last_log_term = 5;
  // Pre-vote (Raft thesis §9.6): ask "would you vote for me?" without
  // incrementing any term, so a partitioned node cannot disrupt a healthy
  // leader when it rejoins.
  bool pre_vote = 6;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint32 group = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 prev_log_index = 4;
  uint64 prev_log_term = 5;
  repeated Entry entries = 6;
  uint64 leader_commit = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // Fast log backtracking (Raft §5.3, end): on a mismatch the follower tells
  // the leader which term conflicted and where that term starts, so the leader
  // skips a whole term per round trip instead of one entry.
  uint64 conflict_index = 3;
  uint64 conflict_term = 4;
}

message InstallSnapshotRequest {
  uint32 group = 1;
  uint64 term = 2;
  string leader_id = 3;
  uint64 last_included_index = 4;
  uint64 last_included_term = 5;
  bytes data = 6;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}

// InstallSnapshotChunk is the wire form of InstallSnapshotRequest: the first
// chunk carries the header (with empty data), later chunks only carry data.
message InstallSnapshotChunk {
  InstallSnapshotRequest header = 1;
  bytes data = 2;
}

// TimeoutNow tells the target to start an election immediately. It is the last
// step of a leadership transfer (Raft thesis §3.10).
message TimeoutNowRequest {
  uint32 group = 1;
  uint64 term = 2;
  string leader_id = 3;
}

message TimeoutNowResponse {
  uint64 term = 1;
}

service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(stream InstallSnapshotChunk) returns (InstallSnapshotResponse);
  rpc TimeoutNow(TimeoutNowRequest) returns (TimeoutNowResponse);
}

// ---------------------------------------------------------------------------
// KV state machine: commands, results, snapshot
// ---------------------------------------------------------------------------

enum Op {
  OP_PUT = 0;
  OP_DELETE = 1;
}

message Command {
  Op op = 1;
  string key = 2;
  bytes value = 3;
  // Compare-and-set: apply only if the key's current version equals
  // expected_version. 0 means "the key must not exist".
  bool has_expected_version = 4;
  uint64 expected_version = 5;
  // Idempotency key. A retried command with the same request_id is not
  // executed again; the original result is returned.
  string request_id = 6;
  bool cacheable = 7;
  uint32 ttl_seconds = 8;
  // Stamped by the leader when it proposes the command. The state machine
  // must be deterministic, so it may never read the clock itself.
  int64 timestamp_unix_ms = 9;
}

enum Status {
  STATUS_OK = 0;
  STATUS_NOT_FOUND = 1;
  STATUS_VERSION_MISMATCH = 2;
}

message Result {
  Status status = 1;
  uint64 version = 2;
}

message SnapshotRecord {
  string key = 1;
  bytes value = 2;
  uint64 version = 3;
  bool deleted = 4;
  bool cacheable = 5;
  uint32 ttl_seconds = 6;
  int64 updated_unix_ms = 7;
}

message SnapshotDedup {
  string request_id = 1;
  uint64 index = 2;
  Result result = 3;
}

message StoreSnapshot {
  repeated SnapshotRecord records = 1;
  // The deduplication table is part of the state machine. If it were left out
  // of the snapshot, a retry arriving after a restart would execute twice.
  repeated SnapshotDedup dedup = 2;
}
